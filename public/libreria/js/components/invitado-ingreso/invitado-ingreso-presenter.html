<header>
  <h1>Tecnologías y Sistemas Web 25/26</h1>
  <h2>Ingreso al sistema</h2>
</header>

<article>
  <nav class="navbar">
    <ul>
      <li><a id="homeLink" href="index.html">Inicio</a></li>
      <li><a id="ingresoLink" href="invitado-ingreso.html">Ingreso</a></li>
      <li><a id="registroLink" href="invitado-registro.html">Registro</a></li>
    </ul>
  </nav>

  <div class="contenido">
    <div class="info">
      <div id="mensajesContainer" class="mensajes-container"></div>
      <form class="ingreso" id="usuarioForm" name="usuario">
        <label for="emailInput">Email</label>
        <input
          id="emailInput"
          name="email"
          type="email"
          placeholder="Ingrese su correo electrónico"
          required
        ><br>

        <label for="passwordInput">Contraseña</label>
        <input
          id="passwordInput"
          name="password"
          type="password"
          placeholder="Ingrese la contraseña"
          required
        ><br>

        <label for="rolSelect">Rol</label>
        <select id="rolSelect" name="rol" required>
          <option value="CLIENTE" selected>CLIENTE</option>
          <option value="ADMIN">ADMIN</option>
        </select><br>

        <footer>
          <input id="ingresarInput" name="ingresar" type="submit" value="Ingresar">
        </footer>
      </form>
    </div>

  </div>
</article>
