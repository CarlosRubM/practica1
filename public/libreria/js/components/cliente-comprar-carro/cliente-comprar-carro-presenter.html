<header>
  <h1>Tecnologías y Sistemas Web 24/25</h1>
  <h2>Cliente Comprar Carro</h2>
</header>

<article>
  <nav class="navbar">
    <ul>
      <li><a id="homeLink" href="cliente-home.html">Inicio</a></li>
      <li><a id="carroLink" href="cliente-carro.html" class="active">Carro</a></li>
      <li><a id="facturasLink" href="cliente-compras.html">Facturas</a></li>
      <li><a id="perfilLink" href="cliente-perfil.html">Perfil</a></li>
      <li><a id="salirLink" href="index.html">Salir</a></li>
    </ul>
  </nav>

  <div class="contenido">
    <nav class="toolbar"></nav>

    <div class="info">
      <div class="mensajes-container" id="mensajesContainer"></div>

      <!-- Formulario de compra -->
      <section id="compraSection" class="compra-form">
        <form id="formCompra">
          <div class="form-row">
            <div class="form-group">
              <label for="fecha">Fecha</label>
              <input type="date" id="fecha" name="fecha" required>
            </div>
            <div class="form-group">
              <label for="dni">DNI</label>
              <input type="text" id="dni" name="dni" readonly>
            </div>
          </div>

          <div class="form-group">
            <label for="razonSocial">Razón Social</label>
            <input type="text" id="razonSocial" name="razonSocial" required>
          </div>

          <div class="form-group">
            <label for="direccion">Dirección</label>
            <textarea id="direccion" name="direccion" rows="3" required></textarea>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" readonly>
          </div>

          <!-- Tabla del carro -->
          <table id="carroTabla" class="carro-table">
            <thead>
              <tr>
                <th style="width:80px">Cant.</th>
                <th>Detalle</th>
                <th style="width:120px">Unidad</th>
                <th style="width:120px">Total</th>
              </tr>
            </thead>

            <tbody id="carroBody">
              <!-- Filas del carro -->
            </tbody>

            <tfoot>
              <tr>
                <td colspan="3" class="label">IVA €</td>
                <td id="ivaCell">0,00</td>
              </tr>
              <tr>
                <td colspan="3" class="label total">Total €</td>
                <td id="totalCell">0,00</td>
              </tr>
            </tfoot>
          </table>

          <!-- Botón de pago -->
          <nav class="navbar">
            <ul>
              <li><button type="submit" id="pagarBtn">Pagar</button></li>
            </ul>
          </nav>
        </form>
      </section>

      <!-- Template para filas del carro -->
      <template id="tpl-compra-row">
        <tr class="carro-item">
          <td>
            <input class="cantidadInput" type="number" min="0" step="1" value="1" aria-label="Cantidad">
          </td>
          <td class="detalle">
            <span class="titulo"></span><br>
            <small class="isbn"></small>
          </td>
          <td class="precioUnit">0,00</td>
          <td class="precioTotal">0,00</td>
        </tr>
      </template>

      <footer>
        Prof. Dr. Ricardo Tesoriero Pszytula<br>
        Tecnologías y Sistemas Web 24/25<br>
        Universidad de Castilla-La Mancha<br>
        <small>20 de septiembre de 2021</small>
      </footer>
    </div>
  </div>
</article>
