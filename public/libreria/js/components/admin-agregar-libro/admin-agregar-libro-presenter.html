<header>
  <h1>Tecnologías y Sistemas Web 25/26</h1>
  <h2>Administrador Agregar Libro</h2>
</header>

<article>
  <nav class="navbar">
      <ul>
        <li><a id="homeLink" href="admin-home.html">Inicio</a></li>
        <li><a id="perfilLink" href="admin-perfil.html">Perfil</a></li>
        <li><a id="salirLink" href="index.html">Salir</a></li>
      </ul>
  </nav>

  <div class="contenido">
    <div class="mensajes-container" id="mensajesContainer"></div>

    <form id="agregarLibroForm" class="form-libro">
      <div class="form-field">
        <label for="tituloInput">Título</label>
        <input type="text" id="tituloInput" required />
      </div>

      <div class="form-field">
        <label for="autoresInput">Autores</label>
        <input type="text" id="autoresInput" required />
      </div>

      <div class="form-field">
        <label for="isbnInput">ISBN</label>
        <input type="text" id="isbnInput" required />
      </div>

      <div class="form-field">
        <label for="precioInput">Precio</label>
        <input type="number" id="precioInput" required />
      </div>

      
      <div class="form-field">
        <label for="stockInput">Stock</label>
        <input type="number" id="stockInput" required />
      </div>

      <div class="form-field">
        <label for="descripcionInput">Descripción</label>
        <textarea id="descripcionInput" rows="4" required></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" id="guardarButton">Guardar</button>
        <button type="button" id="cancelarButton">Cancelar</button>
      </div>
    </form>
  </div>

  
</article>
