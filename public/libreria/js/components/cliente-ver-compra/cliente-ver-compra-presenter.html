<header>
  <h1>Tecnologías y Sistemas Web 25/26</h1>
  <h2>Detalle de Factura</h2>
</header>

<article>
  <nav class="navbar">
    <ul>
      <li><a id="homeLink" href="cliente-home.html">Inicio</a></li>
      <li><a id="carroLink" href="cliente-carro.html">Carro</a></li>
      <li><a id="facturasLink" href="cliente-lista-compras.html" class="active">Facturas</a></li>
      <li><a id="perfilLink" href="cliente-perfil.html">Perfil</a></li>
      <li><a id="salirLink" href="index.html">Salir</a></li>
    </ul>
  </nav>

  <div class="contenido">
    <nav class="toolbar"></nav>

    <div class="info">
      <div class="mensajes-container" id="mensajesContainer"></div>

      <section id="facturaSection" class="factura">
        <div class="factura-field">
          <label>Número:</label>
          <input type="text" id="numeroFactura" readonly>
        </div>
        
        <div class="factura-field">
          <label>Fecha:</label>
          <input type="text" id="fechaFactura" readonly>
        </div>
        
        <div class="factura-field">
          <label>Razón Social:</label>
          <input type="text" id="razonSocial" readonly>
        </div>
        
        <div class="factura-field">
          <label>DNI:</label>
          <input type="text" id="dniFactura" readonly>
        </div>
        
        <div class="factura-field">
          <label>Dirección:</label>
          <input type="text" id="direccionFactura" readonly>
        </div>
        
        <div class="factura-field">
          <label>Email:</label>
          <input type="text" id="emailFactura" readonly>
        </div>

        <div class="carro">
          <table id="itemsTabla">
            <thead>
              <tr>
                <th class="item-cantidad">Cant.</th>
                <th class="item-detalle">Detalle</th>
                <th class="item-unidad">Unidad</th>
                <th class="item-total">Total</th>
              </tr>
            </thead>

            <tbody id="itemsBody">
            </tbody>

            <tfoot>
              <tr>
                <th colspan="3">IVA €</th>
                <th id="ivaCell" class="iva">0,00</th>
              </tr>
              <tr>
                <th colspan="3">Total €</th>
                <th id="totalCell" class="total">0,00</th>
              </tr>
            </tfoot>
          </table>
        </div>
      </section>

      <template id="tpl-item-row">
        <tr class="item-row">
          <td class="item-cantidad"></td>
          <td class="item-detalle">
            <strong class="titulo"></strong><br>
            <small class="isbn"></small>
          </td>
          <td class="item-unidad">0,00</td>
          <td class="item-total">0,00</td>
        </tr>
      </template>
    </div>

  </div>
</article>
