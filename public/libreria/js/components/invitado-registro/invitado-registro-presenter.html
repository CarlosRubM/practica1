<header>
  <h1>Tecnologías y Sistemas Web 25/26</h1>
  <h2>Página Principal</h2>
</header>
<article>
  <nav class="navbar">
    <ul>
      <li><a id="homeLink" href="index.html">Inicio</a></li>
      <li><a id="ingresoLink" href="invitado-ingreso.html">Ingreso</a></li>
      <li><a id="registroLink" href="invitado-registro.html">Registro</a></li>
    </ul>
  </nav>
  <div class="contenido">
    <nav class="toolbar">
      <!-- Toolbar comentado -->
    </nav>
    <div class="info">
      <div class="mensajes-container" id="mensajesContainer"></div>
      <!-- FORMULARIO DE REGISTRO -->
      <form id="registroForm" class="registro-form">
        <div class="form-group">
          <label for="dni">DNI</label>
          <input type="text" id="dni" name="dni" placeholder="DNI" required>
        </div>

        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
        </div>
        
        <div class="form-group">
          <label for="apellidos">Apellidos</label>
          <input type="text" id="apellidos" name="apellidos" placeholder="Apellidos" required>
        </div>
        
        <div class="form-group">
          <label for="direccion">Dirección</label>
          <textarea id="direccion" name="direccion" rows="3" placeholder="Direccion" required></textarea>
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nombre@correo.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        
        <div class="form-group">
          <label for="rol">Rol</label>
          <select id="rol" name="rol" required>
            <option value="CLIENTE" selected>CLIENTE</option>
            <option value="ADMIN">ADMINISTRADOR</option>
          </select>
        </div>
        
        <div class="form-actions">
          <button type="submit" id="registroBtn" class="boton">Registro</button>
        </div>
      </form>
    </div>

  </div>
</article>
